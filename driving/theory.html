<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Theory Tracker">
<meta name="theme-color" content="#7B4FA6">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theory Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--white:#FFFFFF;--text:#2D2A35;--muted:#9B96A8;--border:#EDE9E3;
--w1:#E8D5F5;--w1t:#7B4FA6;--w1b:#F5EDFB;--w2:#D5EEF5;--w2t:#2E7FA0;--w2b:#EAF7FB;
--w3:#F5D5E8;--w3t:#A64F7B;--w3b:#FBE9F4;--w4:#F5E8D5;--w4t:#A67B4F;--w4b:#FBF2E9;
--w5:#D5F5E8;--w5t:#2E8060;--w5b:#E9FBF4;--w6:#F0F5D5;--w6t:#6B7A30;--w6b:#F7FBE9;
--c:#C9A8E8;--c-soft:#F0E6FA;--c-text:#7B4FA6;--v:#8ADBC5;--v-soft:#E0F7F1;--v-text:#2E8060;
--radius:16px;--radius-sm:10px;--radius-pill:100px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:"Nunito",sans-serif;font-size:14px;min-height:100vh;}
.top-bar{background:var(--white);border-bottom:1.5px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.logo{font-family:"Fraunces",serif;font-size:1.4rem;color:var(--text);letter-spacing:-0.02em;}
.logo .star{color:var(--c-text);}
.tabs{display:flex;gap:3px;background:var(--border);border-radius:var(--radius-pill);padding:3px;margin:1.25rem auto 1rem;max-width:380px;}
.tab-btn{flex:1;padding:7px 8px;border:none;border-radius:var(--radius-pill);font-family:"Nunito",sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;background:transparent;color:var(--muted);}
.tab-btn.active{background:var(--white);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.main{max-width:660px;margin:0 auto;padding:0 1.5rem 5rem;}
.welcome{text-align:center;padding:1.25rem 0 0.85rem;}
.welcome h2{font-family:"Fraunces",serif;color:var(--text);line-height:1.02;}
.welcome h2 .line-main{display:block;font-size:1.15rem;font-family:"Nunito",sans-serif;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.welcome h2 .line-accent{display:block;font-size:2.15rem;font-weight:400;}
.welcome h2 .soft{color:var(--v-text);}
.welcome h2 .script{font-style:italic;color:var(--c-text);}
.welcome h2::after{content:"";display:block;width:92px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--c),var(--v));margin:10px auto 0;}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem;}
.pick-btn{background:var(--white);border:2px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all 0.18s;text-align:left;}
.pick-btn:hover{border-color:var(--c);transform:translateY(-1px);}
.pick-btn.active-c{border-color:var(--c);background:var(--c-soft);}
.pick-btn.active-v{border-color:var(--v);background:var(--v-soft);}
.pick-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-style:italic;font-size:15px;flex-shrink:0;}
.av-c{background:var(--c-soft);color:var(--c-text);border:2px solid var(--c);}
.av-v{background:var(--v-soft);color:var(--v-text);border:2px solid var(--v);}
.pick-name{font-size:14px;font-weight:700;color:var(--text);}
.pick-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.vs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem;}
.vs-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;}
.vs-label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-c{background:var(--c-text);}.dot-v{background:var(--v-text);}
.vs-pct{font-family:"Fraunces",serif;font-size:2.4rem;font-weight:600;line-height:1;}
.vs-pct.col-c{color:var(--c-text);}.vs-pct.col-v{color:var(--v-text);}
.vs-detail{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;}
.vs-lead{font-size:11px;font-weight:700;margin-top:6px;padding:3px 10px;border-radius:var(--radius-pill);display:inline-block;}
.track{height:4px;background:var(--bg);border-radius:2px;margin-top:8px;overflow:hidden;}
.track-fill{height:4px;border-radius:2px;transition:width 0.6s cubic-bezier(.4,0,.2,1);}
.fill-c{background:var(--c-text);}.fill-v{background:var(--v-text);}
.syncing{font-size:11px;color:var(--muted);text-align:right;min-height:16px;margin-bottom:2px;}
.banner{border-radius:var(--radius);padding:12px 16px;margin-bottom:1rem;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;border:1.5px solid transparent;}
.week-block{border-radius:var(--radius);margin-bottom:8px;overflow:hidden;border:1.5px solid transparent;transition:box-shadow 0.2s;}
.week-block:hover{box-shadow:0 3px 16px rgba(0,0,0,0.06);}
.week-header{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;}
.wk-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--radius-pill);flex-shrink:0;}
.week-title-text{font-size:13px;font-weight:700;flex:1;}
.week-prog{font-size:12px;font-weight:700;opacity:0.6;}
.chevron{font-size:16px;opacity:0.5;transition:transform 0.2s;flex-shrink:0;line-height:1;}
.chevron.open{transform:rotate(180deg);}
.week-body{padding:0 15px 14px;}
.mini-bar-wrap{height:3px;background:rgba(255,255,255,0.5);border-radius:2px;margin:2px 0 12px;}
.mini-bar{height:3px;border-radius:2px;transition:width 0.3s;}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.5);}
.task-row:last-child{border-bottom:none;}
.check-box{width:19px;height:19px;border-radius:5px;border:2px solid rgba(0,0,0,0.15);cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;background:rgba(255,255,255,0.7);}
.check-box:hover{border-color:rgba(0,0,0,0.3);}
.check-box.done-c{background:var(--c-text);border-color:var(--c-text);}
.check-box.done-v{background:var(--v-text);border-color:var(--v-text);}
.check-box.done-c::after,.check-box.done-v::after{content:"";width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block;}
.task-label{font-size:13px;line-height:1.5;flex:1;font-weight:500;}
.task-label.done{opacity:0.4;text-decoration:line-through;}
.week-quick-links{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.5);}
.quick-link-btn{flex:1;padding:7px;border-radius:var(--radius-pill);font-family:"Nunito",sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s;background:rgba(255,255,255,0.5);}
.quick-link-btn:hover{background:rgba(255,255,255,0.85);}
.log-btn{width:100%;margin-top:1rem;padding:13px;font-family:"Nunito",sans-serif;font-size:14px;font-weight:700;border-radius:var(--radius);border:2px solid var(--border);background:var(--white);color:var(--text);cursor:pointer;transition:all 0.15s;}
.log-btn:hover{background:var(--c-soft);border-color:var(--c);color:var(--c-text);}
/* Notes */
.notes-week-cards{display:flex;flex-direction:column;gap:12px;}
.notes-week-card{background:var(--white);border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--border);}
.nwc-head{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;}
.nwc-head:hover{opacity:0.85;}
.nwc-title{font-size:14px;font-weight:700;flex:1;}
.nwc-count{font-size:12px;opacity:0.6;font-weight:600;}
.nwc-chevron{font-size:16px;opacity:0.4;transition:transform 0.2s;}
.nwc-chevron.open{transform:rotate(180deg);}
.topic-list{padding:0 12px 12px;}
.topic-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:6px;cursor:pointer;transition:all 0.15s;border:1px solid transparent;}
.topic-card:last-child{margin-bottom:0;}
.topic-card:hover{transform:translateX(3px);}
.topic-icon{font-size:20px;flex-shrink:0;}
.topic-text{flex:1;}
.topic-title{font-size:13px;font-weight:700;}
.topic-summary{font-size:11px;opacity:0.7;margin-top:2px;}
.topic-arrow{font-size:16px;opacity:0.4;}
/* Reading view */
.reading-view{position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;}
.reading-top{background:var(--white);border-bottom:1.5px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
.reading-back{font-family:"Nunito",sans-serif;font-size:13px;font-weight:700;color:var(--muted);border:1.5px solid var(--border);border-radius:var(--radius-pill);padding:6px 14px;background:var(--white);cursor:pointer;}
.reading-back:hover{background:var(--bg);}
.reading-crumb{font-size:13px;color:var(--muted);flex:1;}
.reading-body{max-width:620px;margin:0 auto;padding:1.5rem 1.5rem 2rem;}
.reading-topic-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 12px;border-radius:var(--radius-pill);margin-bottom:1rem;}
.reading-h1{font-family:"Fraunces",serif;font-size:1.6rem;font-weight:400;line-height:1.2;margin-bottom:0.4rem;}
.reading-summary{font-size:13px;color:var(--muted);margin-bottom:1.25rem;line-height:1.6;font-style:italic;}
.key-facts{border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:1.5rem;}
.key-facts-title{font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;margin-bottom:10px;opacity:0.7;}
.key-fact-item{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:13px;font-weight:600;line-height:1.4;}
.key-fact-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.note-section{margin-bottom:1.4rem;}
.note-heading{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.note-body{font-size:13px;line-height:1.8;}
.diagram-wrap{margin:12px 0 4px;}
.reading-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2rem;padding-top:1.5rem;border-top:1.5px solid var(--border);}
.action-btn{padding:13px;border-radius:var(--radius);font-family:"Nunito",sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;border:2px solid;text-align:center;}
.action-btn-primary{background:var(--text);color:var(--white);border-color:var(--text);}
.action-btn-primary:hover{opacity:0.85;}
.action-btn-secondary{background:var(--white);color:var(--text);border-color:var(--border);}
.action-btn-secondary:hover{background:var(--bg);}
/* Quiz tab */
.quiz-section-title{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.mock-test-card{background:var(--white);border:2px solid var(--c);border-radius:var(--radius);padding:18px 20px;margin-bottom:1.25rem;display:flex;align-items:center;gap:14px;}
.mock-icon{font-size:2rem;flex-shrink:0;}
.mock-text{flex:1;}
.mock-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;}
.mock-sub{font-size:12px;color:var(--muted);}
.mock-start-btn{font-family:"Nunito",sans-serif;font-size:13px;font-weight:700;padding:10px 18px;border-radius:var(--radius-pill);border:none;background:var(--c-text);color:var(--white);cursor:pointer;flex-shrink:0;transition:all 0.15s;}
.mock-start-btn:hover{opacity:0.85;}
.weak-spot-card{background:var(--white);border:2px solid #FF8C00;border-radius:var(--radius);padding:18px 20px;margin-bottom:1.25rem;display:flex;align-items:center;gap:14px;}
.weak-empty{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:1.25rem;font-size:13px;color:var(--muted);text-align:center;}
.quiz-intro{font-size:13px;color:var(--muted);text-align:center;padding:0.25rem 0 0.75rem;}
.quiz-wk-cards{display:flex;flex-direction:column;gap:10px;}
.quiz-wk-card{background:var(--white);border-radius:var(--radius);overflow:hidden;}
.qwc-head{display:flex;align-items:center;gap:10px;padding:13px 15px;}
.qwc-title{font-size:13px;font-weight:700;flex:1;}
.qwc-pool{font-size:11px;font-weight:700;opacity:0.5;}
.rounds-row{display:flex;gap:8px;padding:0 15px 13px;flex-wrap:wrap;}
.round-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-pill);font-family:"Nunito",sans-serif;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid;transition:all 0.15s;}
.round-btn:hover:not(.locked-round){transform:translateY(-1px);}
.round-btn.locked-round{opacity:0.3;cursor:not-allowed;}
.round-num{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.locked-hint{font-size:12px;color:var(--muted);padding:0 15px 13px;font-style:italic;}
/* Active quiz */
.active-quiz{background:var(--white);border-radius:var(--radius);padding:20px;margin-top:1rem;}
.aq-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.aq-title{font-size:13px;font-weight:700;}
.aq-close{font-family:"Nunito",sans-serif;font-size:12px;font-weight:700;color:var(--muted);border:1.5px solid var(--border);border-radius:var(--radius-pill);padding:4px 12px;background:transparent;cursor:pointer;}
.aq-close:hover{background:var(--bg);}
.aq-prog{height:4px;background:var(--bg);border-radius:2px;margin-bottom:14px;overflow:hidden;}
.aq-prog-fill{height:4px;border-radius:2px;transition:width 0.3s;}
.aq-counter{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px;}
.aq-q{font-size:15px;font-weight:700;line-height:1.5;margin-bottom:14px;}
.aq-opts{display:flex;flex-direction:column;gap:8px;}
.aq-opt{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 15px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;text-align:left;font-family:"Nunito",sans-serif;width:100%;color:var(--text);}
.aq-opt:hover:not(:disabled){border-color:var(--muted);background:var(--white);}
.aq-opt.correct{background:#E9FBF4;border-color:#2E8060;color:#085041;}
.aq-opt.wrong{background:#FBE9F4;border-color:#A64F7B;color:#4B1528;}
.aq-opt:disabled{cursor:default;}
.aq-feedback{font-size:13px;margin-top:12px;font-weight:700;min-height:20px;}
.aq-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
.aq-nav-btn{font-family:"Nunito",sans-serif;font-size:13px;font-weight:700;padding:9px 20px;border-radius:var(--radius-pill);border:1.5px solid var(--border);background:var(--white);cursor:pointer;transition:all 0.15s;color:var(--text);}
.aq-nav-btn:hover:not(:disabled){background:var(--bg);}
.aq-nav-btn:disabled{opacity:0.3;cursor:default;}
.aq-score-mid{font-size:12px;font-weight:700;color:var(--muted);}
.aq-complete{text-align:center;padding:10px 0;}
.aq-big{font-family:"Fraunces",serif;font-size:2.8rem;font-weight:600;}
.aq-pass{color:#2E8060;}.aq-fail{color:#A64F7B;}
.aq-msg{font-size:14px;font-weight:700;margin-top:6px;color:var(--muted);}
.aq-pass-banner{background:#E9FBF4;border:2px solid #2E8060;border-radius:var(--radius-sm);padding:12px 16px;margin-top:14px;font-size:13px;font-weight:700;color:#085041;}
.aq-fail-banner{background:#FBE9F4;border:2px solid #A64F7B;border-radius:var(--radius-sm);padding:12px 16px;margin-top:14px;font-size:13px;font-weight:700;color:#4B1528;}
.aq-retry{font-family:"Nunito",sans-serif;font-size:13px;font-weight:700;padding:10px 24px;border-radius:var(--radius-pill);border:1.5px solid var(--border);background:var(--white);cursor:pointer;margin-top:14px;transition:all 0.15s;color:var(--text);display:inline-block;}
.aq-retry:hover{background:var(--bg);}
.no-user{text-align:center;padding:3rem 1rem;}
.no-user h3{font-family:"Fraunces",serif;font-size:1.4rem;font-weight:400;font-style:italic;color:var(--text);margin-bottom:6px;}
.no-user p{color:var(--muted);font-size:13px;}
@media(max-width:480px){.top-bar{padding:1rem 1.25rem;}.main{padding:0 1.25rem 5rem;}.vs-pct{font-size:2rem;}.reading-actions{grid-template-columns:1fr;}.mock-test-card,.weak-spot-card{flex-wrap:wrap;}.mock-start-btn{width:100%;text-align:center;}}

/* Dayframe readability pass: larger tracker text + clean white canvas */
body{font-size:16px;background:#fff;}
.logo{font-size:1.55rem;}
.main{max-width:760px;}
.tabs{max-width:440px;}
.tab-btn{font-size:14px;padding:9px 10px;}
.welcome h2 .line-main{font-size:1.3rem;}
.welcome h2 .line-accent{font-size:2.45rem;}
.syncing{font-size:12px;}
.banner{font-size:14px;}
.wk-badge{font-size:12px;}
.week-title-text{font-size:15px;}
.week-prog{font-size:13px;}
.task-label{font-size:15px;line-height:1.55;}
.quick-link-btn{font-size:13px;padding:9px;}
.log-btn{font-size:15px;padding:14px;}
.nwc-title{font-size:15px;}
.nwc-count{font-size:13px;}
.topic-title{font-size:15px;}
.topic-summary{font-size:13px;}
.reading-back,.reading-crumb{font-size:14px;}
.reading-h1{font-size:1.9rem;}
.reading-summary{font-size:15px;}
.key-facts-title{font-size:12px;}
.key-fact-item{font-size:15px;}
.note-heading{font-size:16px;}
.note-body{font-size:15px;}
.action-btn{font-size:14px;}
.quiz-section-title{font-size:12px;}
.mock-title{font-size:17px;}

</style>
</head>
<body>
<div class="top-bar">
  <div class="logo">theory<span class="star"> &#10022; </span>tracker</div>
</div>
<div class="main">
  <div class="welcome"><h2><span class="line-main">Let's pass</span><span class="line-accent"><span class="soft">our</span> <span class="script">theory</span></span></h2></div><div class="syncing" id="sync-status"></div>
  <div class="tabs">
    <button class="tab-btn active" id="tab-track" onclick="switchTab('track')">Study plan</button>
    <button class="tab-btn" id="tab-notes" onclick="switchTab('notes')">Study notes</button>
    <button class="tab-btn" id="tab-quiz" onclick="switchTab('quiz')">Quizzes</button>
  </div>
  <div id="tab-track-content"><div id="main-area"><div class="no-user"><h3>Sign in to Dayframe</h3><p>to view your study plan.</p></div></div></div>
  <div id="tab-notes-content" style="display:none;"><div id="notes-area"><div class="no-user"><h3>Sign in to Dayframe</h3><p>to access study notes.</p></div></div></div>
  <div id="tab-quiz-content" style="display:none;"><div id="quiz-area"><div class="no-user"><h3>Sign in to Dayframe</h3><p>to access quizzes.</p></div></div></div>
</div>
<div class="reading-view" id="reading-view" style="display:none;"></div>

    var s=JSON.parse(localStorage.getItem("dayframe_session")||"{}");
    return s&&s.access_token?s.access_token:"";
  }catch(e){return "";}
}

function theoryRequest(method,data){
  var token=dayframeAccessToken();
  if(!token)return Promise.reject(new Error("Sign in to Dayframe"));
  var options={method:method,headers:{"Authorization":"Bearer "+token,"Accept":"application/json"}};
  if(data!==undefined){
    options.headers["Content-Type"]="application/json";
    options.body=JSON.stringify(data);
  }
  return fetch(WORKER_URL,options).then(function(r){
    if(!r.ok)return r.json().catch(function(){return {};}).then(function(d){throw new Error(d.error||"Theory sync failed");});
    return r;
  });
}

function fetchUser(user){
  var local=readLocalUser(user)||{};
  return theoryRequest("GET")
    .then(function(r){return r.json();})
    .then(function(d){
      var remote=d&&typeof d==="object"&&!Array.isArray(d)?d:{};
      if(Object.keys(remote).length===0&&Object.keys(local).length>0){
        cache[user]=local;
        pushUser(user,local);
        return local;
      }
      cache[user]=remote;
      writeLocalUser(user,remote);
      return remote;
    })
    .catch(function(){cache[user]=local;return local;});
}

function pushUser(user,data){
  cache[user]=data;
  writeLocalUser(user,data);
  return theoryRequest("POST",data)
    .then(function(){setSyncStatus("saved");})
    .catch(function(){setSyncStatus("saved on this device");});
}

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function startMockTest(){

  renderActiveQuiz();
}

}

function startRoundQuiz(wi,ri){

}

function saveWrongAnswers(quiz){
  if(!currentUser||quiz.saved)return;
  quiz.saved=true;
  var data=cache[currentUser]||{};
  if(!data.weakQuestions)data.weakQuestions=[];
  var existing=data.weakQuestions;

  var totalCorrect=Object.keys(quiz.answers).filter(function(k){return quiz.answers[k]===quiz.questions[parseInt(k)].a;}).length;

  Object.keys(quiz.answers).forEach(function(k){
    var ki=parseInt(k);
    if(quiz.answers[k]!==quiz.questions[ki].a){
      var q=quiz.questions[ki];
      var found=false;
      for(var i=0;i<existing.length;i++){if(existing[i].q===q.q){found=true;break;}}
      if(!found)existing.push({q:q.q,opts:q.opts,a:q.a,wi:q.wi||0});
    }
  });

  if(existing.length>50)existing=existing.slice(existing.length-50);
  data.weakQuestions=existing;

  // Track mock test stats
  if(quiz.type==="mock"){
    data.mockCount=(data.mockCount||0)+1;
    if(data.mockBest===null||data.mockBest===undefined||totalCorrect>data.mockBest){
      data.mockBest=totalCorrect;
    }
    // Save score history (last 10)
    if(!data.mockHistory)data.mockHistory=[];
    data.mockHistory.push({score:totalCorrect,date:todayStr()});
    if(data.mockHistory.length>10)data.mockHistory=data.mockHistory.slice(data.mockHistory.length-10);
  }

  cache[currentUser]=data;
  clearTimeout(saveTimer);saveTimer=setTimeout(function(){pushUser(currentUser,data);},800);
}

        html+='<div style="margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:var(--radius-sm);text-align:left;">';
        html+='<div style="font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Your last '+mockHistory.length+' scores</div>';
        html+='<div style="display:flex;gap:8px;flex-wrap:wrap;">';
        for(var hi=0;hi<mockHistory.length;hi++){
          var hs=mockHistory[hi];
          var hpassed=hs.score>=MOCK_PASS;
          html+='<span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--radius-pill);background:'+(hpassed?"#E9FBF4":"#FBE9F4")+';color:'+(hpassed?"#085041":"#4B1528")+';">'+hs.score+'/50</span>';
        }
        html+='</div><div style="font-size:11px;color:var(--muted);margin-top:8px;">Best score: '+mockBest+'/50</div></div>';
      }
      html+='<button class="mock-start-btn" style="width:100%;margin-top:14px;padding:13px;" onclick="startMockTest()">&#9654; New mock test - fresh random questions</button>';
      html+='</div>';
} else {
      var grade=Math.round((totalCorrect/aq.questions.length)*100);
      var msg=grade===100?"Perfect!":grade>=80?"Excellent!":grade>=60?"Good effort - keep going!":"Keep studying and try again!";
      html+='<div class="aq-complete"><div class="aq-big" style="color:'+accentCol+';">'+totalCorrect+'/'+aq.questions.length+'</div><div class="aq-msg">'+msg+' ('+grade+'%)</div>';
      if(isWeak)html+='<button class="aq-retry" onclick="startWeakSpotQuiz()">Practice weak spots again</button>';
      else html+='<button class="aq-retry" onclick="startRoundQuiz('+aq.wi+','+aq.ri+')">Try again with new questions</button>';
      html+='<br><button class="aq-retry" style="margin-top:8px;" onclick="openNotes('+(aq.wi||0)+')">&#128214; Review notes</button>';
      html+='</div>';
    }
  } else {
    html+='<div class="aq-counter" style="color:'+accentCol+';">Question '+(aq.idx+1)+' of '+aq.questions.length+'</div>';
    html+='<div class="aq-q">'+q.q+'</div><div class="aq-opts">';
    for(var oi=0;oi<q.opts.length;oi++){
      var cls="aq-opt";
      if(isAnswered){if(oi===q.a)cls+=" correct";else if(oi===aq.answers[aq.idx])cls+=" wrong";}
      html+='<button class="'+cls+'" '+(isAnswered?"disabled":"")+'  onclick="answerQuiz('+oi+')">'+q.opts[oi]+'</button>';
    }
    html+='</div>';
    if(isAnswered)html+='<div class="aq-feedback" style="color:'+accentCol+';">'+(isCorrect?"Correct!":"The answer is: "+q.opts[q.a])+'</div>';
    html+='<div class="aq-nav"><button class="aq-nav-btn" onclick="quizPrev()" '+(aq.idx===0?"disabled":"")+'>prev</button><span class="aq-score-mid">'+totalCorrect+'/'+answered+' correct</span><button class="aq-nav-btn" onclick="quizNext()" '+(aq.idx>=aq.questions.length-1||!isAnswered?"disabled":"")+'>next</button></div>';
  }
  html+='</div>';
  document.getElementById("quiz-area").innerHTML=html;

  // Refresh timer every second for mock test
  if(isMock&&!allDone){
    setTimeout(function(){if(activeQuiz&&activeQuiz.type==="mock"&&!activeQuiz.done)renderActiveQuiz();},1000);
  }
}

function answerQuiz(oi){
  if(!activeQuiz||activeQuiz.answers[activeQuiz.idx]!==undefined)return;
  activeQuiz.answers[activeQuiz.idx]=oi;
  renderActiveQuiz();
}

function quizNext(){var aq=activeQuiz;if(aq&&aq.idx<aq.questions.length-1&&aq.answers[aq.idx]!==undefined){aq.idx++;renderActiveQuiz();}}
function quizPrev(){if(activeQuiz&&activeQuiz.idx>0){activeQuiz.idx--;renderActiveQuiz();}}
function closeQuiz(){activeQuiz=null;renderQuizTab(-1);}
function handleKey(e,key){if(e.key===" "||e.key==="Enter")toggleTask(key);}
function toggleWeek(wi){openWeeks[wi]=!openWeeks[wi];renderTracker();}

function toggleTask(key){
  if(!currentUser)return;
  var data=cache[currentUser]||{};
  if(!data.checked)data.checked={};
  data.checked[key]=!data.checked[key];cache[currentUser]=data;
  clearTimeout(saveTimer);saveTimer=setTimeout(function(){pushUser(currentUser,data);},800);
  updateVsBar();renderTracker();
}

function logToday(){
  if(!currentUser)return;
  var today=todayStr(),data=cache[currentUser]||{};
  if(!data.studiedDates)data.studiedDates=[];
  if(data.studiedDates.indexOf(today)>=0)return;
  data.studiedDates.push(today);
  var yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  var yStr=yesterday.toISOString().slice(0,10);
  data.streak=(data.lastDate===yStr||data.lastDate===today)?(data.streak||0)+1:1;
  data.lastDate=today;cache[currentUser]=data;
  pushUser(currentUser,data);updateVsBar();renderTracker();
}

initDayframeTheory();
</script>

if('serviceWorker' in navigator){

    navigator.serviceWorker.register('/sw.js').then(function(reg){
      console.log('SW registered');
    }).catch(function(e){
      console.log('SW failed:', e);
    });
  });
}
</script>
