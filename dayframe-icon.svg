<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Dayframe</title>
  <desc id="desc">A rounded Dayframe app icon with a white framed D, sunrise, progress line and calm multi-color panels.</desc>
  <defs>
    <linearGradient id="bg" x1="52" y1="34" x2="468" y2="484" gradientUnits="userSpaceOnUse">
      <stop stop-color="#191D3C"/>
      <stop offset=".46" stop-color="#4B4FCA"/>
      <stop offset="1" stop-color="#51A9C7"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(148 132) rotate(46) scale(232)">
      <stop stop-color="#FFB18F" stop-opacity=".9"/>
      <stop offset=".62" stop-color="#FFB18F" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFB18F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(386 372) rotate(44) scale(218)">
      <stop stop-color="#7EE1C3" stop-opacity=".74"/>
      <stop offset=".58" stop-color="#7EE1C3" stop-opacity=".12"/>
      <stop offset="1" stop-color="#7EE1C3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="226" y1="176" x2="318" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD978"/>
      <stop offset=".48" stop-color="#FF9E70"/>
      <stop offset="1" stop-color="#EF6C82"/>
    </linearGradient>
    <linearGradient id="line" x1="226" y1="298" x2="334" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55C590"/>
      <stop offset="1" stop-color="#7D86F5"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0B102B" flood-opacity=".3"/>
    </filter>
    <clipPath id="innerWindow">
      <path d="M222 184h36c47 0 79 28 79 72s-32 72-79 72h-36Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#warmGlow)"/>
  <rect width="512" height="512" rx="118" fill="url(#coolGlow)"/>
  <path d="M78 142c55-56 117-83 186-83 77 0 139 31 187 94" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="22" stroke-linecap="round"/>
  <path d="M74 378c48 48 108 72 180 72 83 0 150-35 200-104" fill="none" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="18" stroke-linecap="round"/>

  <g filter="url(#softShadow)">
    <path fill="#FFFFFF" fill-rule="evenodd" d="M136 116h122c91 0 154 57 154 140S349 396 258 396H136V116Zm84 68v144h39c48 0 79-28 79-72s-31-72-79-72h-39Z"/>
    <g clip-path="url(#innerWindow)">
      <rect x="208" y="164" width="152" height="188" rx="40" fill="#F7FAFF"/>
      <circle cx="276" cy="241" r="42" fill="url(#sun)"/>
      <path d="M216 281h136" stroke="#E7ECF7" stroke-width="11" stroke-linecap="round"/>
      <path d="M229 303c21-19 42-19 62-1 15 14 29 13 43-3" fill="none" stroke="url(#line)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M248 332c10-8 18-12 29-12s19 4 29 12" fill="none" stroke="#232A48" stroke-opacity=".28" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <circle cx="382" cy="132" r="24" fill="#FFE6AF"/>
  <circle cx="382" cy="132" r="9" fill="#FFFFFF"/>
  <rect x="156" y="140" width="36" height="16" rx="8" fill="#FFB18F"/>
  <rect x="156" y="172" width="36" height="16" rx="8" fill="#8EE2C2"/>
  <rect x="156" y="204" width="36" height="16" rx="8" fill="#AAB1FF"/>
