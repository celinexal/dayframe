name: Dayframe daily reminders

# Sends the "coming up" push notification to everyone who has reminders on.
# Requires repo secret PUSH_CRON_SECRET matching the Cloudflare env var of the
# same name. Runs 07:00 UTC; adjust the cron below for your timezone.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: dayframe-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder push
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUSH_CRON_SECRET:-}" ]; then
            echo "PUSH_CRON_SECRET repo secret is not set — nothing to do."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "https://investly.pages.dev/api/push/run" \
            -H "x-dayframe-cron: ${PUSH_CRON_SECRET}")
          echo "HTTP ${code}"
          cat /tmp/out.json || true
          echo
          test "${code}" = "200"
        env:
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
