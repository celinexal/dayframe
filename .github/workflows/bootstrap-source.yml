name: Import Dayframe source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dayframe-source.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Import uploaded Dayframe source
        shell: bash
        run: |
          set -euo pipefail
          test -s dayframe-source.zip
          unzip -o dayframe-source.zip -d .
          test -s index.html
          test -s _worker.js
          node --check _worker.js
          rm -f dayframe-source.zip bootstrap-worker.b64

      - name: Commit Dayframe source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Import current Dayframe source"
            git push
          fi
