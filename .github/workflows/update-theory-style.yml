name: Update Theory Tracker style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-theory-style.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply readability update
        run: python scripts/update_theory_style.py
      - name: Validate update
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Dayframe readability pass: larger tracker text + clean white canvas' driving/theory.html
          grep -q -- '--bg:#FFFFFF;' driving/theory.html
      - name: Commit updated tracker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/update_theory_style.py .github/workflows/update-theory-style.yml
          git add -A
          git commit -m "Increase Theory Tracker text size and remove cream background"
          git push
