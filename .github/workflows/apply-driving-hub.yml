name: Apply Driving hub update

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_driving_hub.py'
      - '.github/workflows/apply-driving-hub.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Dayframe
        uses: actions/checkout@v6

      - name: Apply Driving hub
        run: python scripts/apply_driving_hub.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          s=open('index.html').read()
          open('/tmp/dayframe-inline.js','w').write('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/dayframe-inline.js

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_driving_hub.py .github/workflows/apply-driving-hub.yml
          git add -A
          git commit -m "Make Driving a choice-based hub"
          git push
