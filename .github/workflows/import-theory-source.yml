name: Import Theory Tracker source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-theory-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download tracker source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p driving
          curl -L --fail --silent --show-error 'https://aa9ae107.theory-tracker.pages.dev/' -o driving/theory.html
          test -s driving/theory.html
          echo "Downloaded $(wc -c < driving/theory.html) bytes"
      - name: Commit tracker source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add driving/theory.html
          git commit -m "Import Theory Tracker source"
          git push
