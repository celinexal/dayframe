name: Deploy Dayframe to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '_worker.js'
      - '_headers'
      - 'assets/**'
      - 'driving/**'
      - '.github/workflows/deploy-pages.yml'

concurrency:
  group: dayframe-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Dayframe
        uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"

      - name: Set build ID
        id: build
        shell: bash
        run: echo "id=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s _worker.js
          test -s driving/theory.html
          test -s driving/theory-overrides.css
          grep -q 'src="/driving/theory.html"' index.html
          grep -q 'Dayframe Theory Tracker desktop sizing' driving/theory-overrides.css

      - name: Prepare deployment folder
        shell: bash
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          cp index.html _worker.js dist/
          [ ! -f _headers ] || cp _headers dist/
          [ ! -f app.js ] || cp app.js dist/
          [ ! -f styles.css ] || cp styles.css dist/
          [ ! -d assets ] || cp -R assets dist/assets
          cp -R driving dist/driving

          python - <<'PY'
          from pathlib import Path
          import os, re

          build = os.environ['BUILD_ID']

          theory = Path('dist/driving/theory.html')
          s = theory.read_text()
          link = f'<link rel="stylesheet" href="/driving/theory-overrides.css?v={build}">'
          s, replaced = re.subn(
              r'<link rel="stylesheet" href="/driving/theory-overrides\.css(?:\?v=[^"]+)?">',
              link,
              s,
              count=1,
          )
          if replaced == 0:
              s = s.replace('</head>', link + '\n</head>', 1)
          theory.write_text(s)

          index = Path('dist/index.html')
          s = index.read_text()
          s, count = re.subn(
              r'src="/driving/theory\.html(?:\?v=[^"]+)?"',
              f'src="/driving/theory.html?v={build}"',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one Theory Tracker iframe, found {count}')
          index.write_text(s)
          PY

      - name: Deploy to investly.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=investly --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
