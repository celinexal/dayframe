name: Deploy Dayframe to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '_worker.js'
      - '_headers'
      - 'assets/**'
      - 'driving/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  deployments: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Dayframe
        uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare GitHub secrets have not been added yet; deployment skipped."
          fi

      - name: Prepare deployment folder
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s _worker.js
          rm -rf dist
          mkdir dist
          cp index.html _worker.js dist/
          [ ! -f _headers ] || cp _headers dist/
          [ ! -f app.js ] || cp app.js dist/
          [ ! -f styles.css ] || cp styles.css dist/
          [ ! -d assets ] || cp -R assets dist/assets
          [ ! -d driving ] || cp -R driving dist/driving
          if [ -f dist/driving/theory.html ] && [ -f dist/driving/theory-overrides.css ]; then
            python - <<'PY'
          from pathlib import Path
          p=Path('dist/driving/theory.html')
          s=p.read_text()
          link='<link rel="stylesheet" href="/driving/theory-overrides.css?v=20260818b">'
          if link not in s:
              s=s.replace('</head>', link+'\n</head>', 1)
          p.write_text(s)
          PY
          fi

      - name: Deploy to investly.pages.dev
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=investly --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
