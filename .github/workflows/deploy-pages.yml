name: Deploy Dayframe to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '_worker.js'
      - '_headers'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'dayframe-icon.svg'
      - 'dayframe-icon-2026.svg'
      - 'assets/**'
      - 'driving/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'

concurrency:
  group: dayframe-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Dayframe
        uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"

      - name: Set build ID
        id: build
        shell: bash
        run: echo "id=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s _worker.js
          test -s manifest.webmanifest
          test -s sw.js
          test -s dayframe-icon.svg
          test -s dayframe-icon-2026.svg
          test -s scripts/dayframe_deploy_patch.py
          test -s scripts/dayframe_overview_update_control.py
          test -s assets/dayframe-standard-home.js
          test -s assets/dayframe-essentials-flo.js
          test -s assets/dayframe-essentials-more.js
          test -s assets/dayframe-essentials-clickfix.js
          test -s assets/dayframe-essentials-customise.js
          test -s assets/dayframe-essentials-pill-left.js
          test -s assets/dayframe-myflo-calendar-actions.js
          test -s assets/dayframe-sector-themes-current.js
          test -s driving/theory.html
          test -s driving/theory-overrides.css
          grep -q 'src="/driving/theory.html"' index.html
          grep -q 'Dayframe Theory Tracker desktop sizing' driving/theory-overrides.css

      - name: Prepare deployment folder
        shell: bash
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          cp index.html _worker.js manifest.webmanifest sw.js dayframe-icon.svg dayframe-icon-2026.svg dist/
          [ ! -f _headers ] || cp _headers dist/
          [ ! -f app.js ] || cp app.js dist/app.js
          [ ! -f styles.css ] || cp styles.css dist/styles.css
          [ ! -d assets ] || cp -R assets dist/assets
          cp -R driving dist/driving

          python - <<'PY'
          from pathlib import Path
          import os, re

          build = os.environ['BUILD_ID']

          theory = Path('dist/driving/theory.html')
          s = theory.read_text()
          link = f'<link rel="stylesheet" href="/driving/theory-overrides.css?v={build}">'
          s, replaced = re.subn(
              r'<link rel="stylesheet" href="/driving/theory-overrides\.css(?:\?v=[^"]+)?">',
              link,
              s,
              count=1,
          )
          if replaced == 0:
              s = s.replace('</head>', link + '\n</head>', 1)
          theory.write_text(s)

          index = Path('dist/index.html')
          s = index.read_text()
          s, count = re.subn(
              r'src="/driving/theory\.html(?:\?v=[^"]+)?"',
              f'src="/driving/theory.html?v={build}"',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one Theory Tracker iframe, found {count}')

          early_style = '<style id="df-early-essentials-cleanup-style">#df-essentials-stage-panel,.driving-side-nav [data-driving-page="driving-theory"],#pg-driving .driving-home-card.theory,#pg-driving-costs,[data-driving-page="driving-costs"],.df-polish-nav-costs{display:none!important}</style>'
          home_style = '<style id="df-home-no-setup-style">#home-setup-card,#home-setup-nudge,.home-setup-card,.home-setup-nudge,.home-setup-step{display:none!important}</style>'
          asset_tags = [
              ('dayframe-essentials-cleanup.js', 'data-dayframe-essentials-cleanup-late'),
              ('dayframe-essentials-flo.js', 'data-dayframe-essentials-flo-late'),
              ('dayframe-essentials-more.js', 'data-dayframe-essentials-more-late'),
              ('dayframe-essentials-clickfix.js', 'data-dayframe-essentials-clickfix-late'),
              ('dayframe-essentials-customise.js', 'data-dayframe-essentials-customise-late'),
              ('dayframe-essentials-pill-left.js', 'data-dayframe-essentials-pill-left-late'),
              ('dayframe-myflo-calendar-actions.js', 'data-dayframe-myflo-calendar-actions-late'),
              ('dayframe-sector-themes-current.js', 'data-dayframe-sector-themes-current-late'),
          ]
          if 'df-early-essentials-cleanup-style' not in s:
              s = s.replace('</head>', early_style + '\n</head>', 1)
          if 'df-home-no-setup-style' not in s:
              s = s.replace('</head>', home_style + '\n</head>', 1)
          for filename, attr in asset_tags:
              path = f'/assets/{filename}'
              versioned = f'{path}?v={build}'
              if path in s:
                  s = re.sub(rf'/assets/{re.escape(filename)}(?:\?v=[^"\']+)?', versioned, s)
              else:
                  tag = f'<script {attr} src="{versioned}" defer></script>'
                  s = s.replace('</head>', tag + '\n</head>', 1)
          standard_home_src = f'/assets/dayframe-standard-home.js?v={build}-home-standard'
          if 'dayframe-standard-home.js' in s:
              s = re.sub(r'/assets/dayframe-standard-home\.js(?:\?v=[^"\']+)?', standard_home_src, s)
          else:
              tag = f'<script data-dayframe-standard-home-loader src="{standard_home_src}" defer></script>'
              s = s.replace('</head>', tag + '\n</head>', 1)
          s = re.sub(
              r'<h1>\s*Everything\s*</h1>',
              '<h1>Everything that matters, without the mental clutter.</h1>',
              s,
              count=1,
              flags=re.I,
          )
          index.write_text(s)
          PY

          python scripts/dayframe_deploy_patch.py
          python scripts/dayframe_overview_update_control.py

          python - <<'PY'
          from pathlib import Path
          import re

          sw = Path('dist/sw.js')
          s = sw.read_text(encoding='utf-8')
          s, cache_count = re.subn(
              r"const DAYFRAME_CACHE\s*=\s*'dayframe-shell-v\d+';",
              "const DAYFRAME_CACHE = 'dayframe-shell-v196';",
              s,
              count=1,
          )
          s, home_count = re.subn(
              r"const DAYFRAME_STANDARD_HOME_SRC\s*=\s*'[^']+';",
              "const DAYFRAME_STANDARD_HOME_SRC = '/assets/dayframe-standard-home.js?v=20260902-no-setup-card-v2';",
              s,
              count=1,
          )
          if cache_count != 1:
              raise SystemExit('dist/sw.js: cache version was not found')
          if home_count != 1:
              raise SystemExit('dist/sw.js: standard home source was not found')
          if 'df-home-no-setup-style' not in s:
              raise SystemExit('dist/sw.js: home no-setup style is missing')
          if 'Everything that matters, without the mental clutter.' not in s:
              raise SystemExit('dist/sw.js: full home heading is missing')
          if re.search(r'<h1>\s*Everything\s*</h1>', s, re.I):
              raise SystemExit('dist/sw.js: short home heading is still present')
          sw.write_text(s, encoding='utf-8')
          PY

      - name: Deploy to investly.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=investly --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
