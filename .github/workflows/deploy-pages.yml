name: Deploy Dayframe to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '_worker.js'
      - '_headers'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'dayframe-icon.svg'
      - 'dayframe-icon-2026.svg'
      - 'assets/**'
      - 'driving/**'
      - '.github/workflows/deploy-pages.yml'

concurrency:
  group: dayframe-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Dayframe
        uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"

      - name: Set build ID
        id: build
        shell: bash
        run: echo "id=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s _worker.js
          test -s manifest.webmanifest
          test -s sw.js
          test -s dayframe-icon.svg
          test -s dayframe-icon-2026.svg
          test -s assets/dayframe-essentials-flo.js
          test -s assets/dayframe-essentials-more.js
          test -s assets/dayframe-essentials-clickfix.js
          test -s assets/dayframe-essentials-customise.js
          test -s assets/dayframe-essentials-pill-left.js
          test -s assets/dayframe-myflo-calendar-actions.js
          test -s driving/theory.html
          test -s driving/theory-overrides.css
          grep -q 'src="/driving/theory.html"' index.html
          grep -q 'Dayframe Theory Tracker desktop sizing' driving/theory-overrides.css

      - name: Prepare deployment folder
        shell: bash
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          cp index.html _worker.js manifest.webmanifest sw.js dayframe-icon.svg dayframe-icon-2026.svg dist/
          [ ! -f _headers ] || cp _headers dist/
          [ ! -f app.js ] || cp app.js dist/app.js
          [ ! -f styles.css ] || cp styles.css dist/styles.css
          [ ! -d assets ] || cp -R assets dist/assets
          cp -R driving dist/driving

          python - <<'PY'
          from pathlib import Path
          import os, re

          build = os.environ['BUILD_ID']

          theory = Path('dist/driving/theory.html')
          s = theory.read_text()
          link = f'<link rel="stylesheet" href="/driving/theory-overrides.css?v={build}">'
          s, replaced = re.subn(
              r'<link rel="stylesheet" href="/driving/theory-overrides\.css(?:\?v=[^"]+)?">',
              link,
              s,
              count=1,
          )
          if replaced == 0:
              s = s.replace('</head>', link + '\n</head>', 1)
          theory.write_text(s)

          index = Path('dist/index.html')
          s = index.read_text()
          s, count = re.subn(
              r'src="/driving/theory\.html(?:\?v=[^"]+)?"',
              f'src="/driving/theory.html?v={build}"',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one Theory Tracker iframe, found {count}')

          essentials_style = '<style id="df-early-essentials-cleanup-style">#df-essentials-stage-panel,.driving-side-nav [data-driving-page="driving-theory"],#pg-driving .driving-home-card.theory,#pg-driving-costs,[data-driving-page="driving-costs"],.df-polish-nav-costs{display:none!important}</style>'
          essentials_loader = f'''<script data-dayframe-essentials-cleanup-bootstrap>
          (() => {{
            const sameAssetLoaded = (src, attr) => {{
              if (document.querySelector('script[' + attr + ']')) return true;
              let targetPath = '';
              try {{
                targetPath = new URL(src, location.href).pathname;
              }} catch {{
                return false;
              }}
              return Array.from(document.scripts).some((script) => {{
                if (!script.src) return false;
                try {{
                  return new URL(script.src, location.href).pathname === targetPath;
                }} catch {{
                  return false;
                }}
              }});
            }};
            const loadScript = (src, attr) => {{
              if (sameAssetLoaded(src, attr)) return null;
              const script = document.createElement('script');
              script.setAttribute(attr, 'true');
              script.src = src;
              script.async = false;
              document.head.appendChild(script);
              return script;
            }};
            const loadEssentials = () => {{
              const loadCalendarActions = () => loadScript('/assets/dayframe-myflo-calendar-actions.js?v={build}', 'data-dayframe-myflo-calendar-actions-late');
              const loadPillLeft = () => {{
                const pillLeft = loadScript('/assets/dayframe-essentials-pill-left.js?v={build}', 'data-dayframe-essentials-pill-left-late');
                if (pillLeft) {{
                  pillLeft.addEventListener('load', loadCalendarActions, {{ once: true }});
                  setTimeout(loadCalendarActions, 900);
                }} else {{
                  loadCalendarActions();
                }}
              }};
              const loadCustomise = () => {{
                const customise = loadScript('/assets/dayframe-essentials-customise.js?v={build}', 'data-dayframe-essentials-customise-late');
                if (customise) {{
                  customise.addEventListener('load', loadPillLeft, {{ once: true }});
                  setTimeout(loadPillLeft, 900);
                }} else {{
                  loadPillLeft();
                }}
              }};
              const loadClickFix = () => {{
                const clickFix = loadScript('/assets/dayframe-essentials-clickfix.js?v={build}', 'data-dayframe-essentials-clickfix-late');
                if (clickFix) {{
                  clickFix.addEventListener('load', loadCustomise, {{ once: true }});
                  setTimeout(loadCustomise, 900);
                }} else {{
                  loadCustomise();
                }}
              }};
              const loadMore = () => {{
                const more = loadScript('/assets/dayframe-essentials-more.js?v={build}', 'data-dayframe-essentials-more-late');
                if (more) {{
                  more.addEventListener('load', loadClickFix, {{ once: true }});
                  setTimeout(loadClickFix, 900);
                }} else {{
                  loadClickFix();
                }}
              }};
              const loadFlo = () => {{
                const flo = loadScript('/assets/dayframe-essentials-flo.js?v={build}', 'data-dayframe-essentials-flo-late');
                if (flo) {{
                  flo.addEventListener('load', loadMore, {{ once: true }});
                  setTimeout(loadMore, 900);
                }} else {{
                  loadMore();
                }}
              }};
              const cleanup = loadScript('/assets/dayframe-essentials-cleanup.js?v={build}', 'data-dayframe-essentials-cleanup-late');
              if (cleanup) {{
                cleanup.addEventListener('load', loadFlo, {{ once: true }});
                setTimeout(loadFlo, 900);
              }} else {{
                loadFlo();
              }}
            }};
            if (document.readyState === 'complete') loadEssentials();
            else window.addEventListener('load', loadEssentials, {{ once: true }});
          }})();
          </script>'''
          if 'data-dayframe-essentials-cleanup-bootstrap' not in s:
              s = s.replace('</head>', essentials_style + essentials_loader + '\n</head>', 1)
          else:
              s = re.sub(
                  r'<script data-dayframe-essentials-cleanup-bootstrap>[\s\S]*?</script>',
                  essentials_loader,
                  s,
                  count=1,
              )
          index.write_text(s)
          PY

      - name: Deploy to investly.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=investly --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
