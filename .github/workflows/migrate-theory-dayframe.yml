name: Migrate Theory Tracker to Dayframe accounts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_theory_dayframe.py'
      - '.github/workflows/migrate-theory-dayframe.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Dayframe
        uses: actions/checkout@v6

      - name: Remove named theory profiles
        shell: bash
        run: |
          set -euo pipefail
          python scripts/migrate_theory_dayframe.py

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'src="/driving/theory.html"' index.html
          grep -q 'function dayframeUserKey()' driving/theory.html
          ! grep -q "selectUser('celine')" driving/theory.html
          ! grep -q "selectUser('valentina')" driving/theory.html
          ! grep -q 'Select your name above' driving/theory.html

      - name: Commit permanent source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/migrate_theory_dayframe.py .github/workflows/migrate-theory-dayframe.yml .github/workflows/import-theory-source.yml
          git add -A
          git commit -m "Use Dayframe account for Theory Tracker"
          git push
